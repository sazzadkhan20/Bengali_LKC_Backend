# Production / university server profile
spring:
  config:
    activate:
      on-profile: prod

  docker:
    compose:
      enabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    validate-on-migrate: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

lkc:
  bootstrap:
    seed-demo-users: false
    # Loads the bundled XML only into an empty lexicon; skipped once entries exist.
    import-lexicon-xml: ${IMPORT_LEXICON_XML:true}
    clear-core-lexicon-before-import: false
    lexicon-xml-path: ${LEXICON_XML_PATH:/app/data/lexicon.xml}
  mail:
    demo-expose-secrets: false
  security:
    cors:
      allowed-origins: ${CORS_ORIGINS}

logging:
  level:
    root: WARN
    com.bengalilkc: INFO
    org.springframework.security: WARN
