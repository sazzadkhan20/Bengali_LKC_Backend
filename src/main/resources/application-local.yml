# Local development — Docker Compose auto-starts a dedicated Postgres server.
# Flyway creates/migrates all tables on application startup.
spring:
  config:
    activate:
      on-profile: local

  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start_only
      readiness:
        timeout: 120s
      skip:
        in-tests: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bengali_lkc}
    username: ${DB_USERNAME:lkc_admin}
    password: ${DB_PASSWORD:lkc_secure_change_me}
    hikari:
      # Wait for Docker Postgres to become reachable (do not fail instantly)
      connection-timeout: 30000
      initialization-fail-timeout: 120000

  jpa:
    show-sql: false
    hibernate:
      # Flyway owns schema; Hibernate only validates after migrations
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:benlkc2026@gmail.com}
    password: ${MAIL_PASSWORD:hgwdhynfcwtualgl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

lkc:
  bootstrap:
    seed-demo-users: true
    # Corpus already loaded from Bangla Mono Lingual Lexicons.xml — skip wipe on restart
    import-lexicon-xml: true
    clear-core-lexicon-before-import: false
  mail:
    from: ${MAIL_FROM:benlkc2026@gmail.com}
    from-name: ${MAIL_FROM_NAME:Bengali LKC (No Reply)}
    username: ${MAIL_USERNAME:benlkc2026@gmail.com}
    password: ${MAIL_PASSWORD:hgwdhynfcwtualgl}
    demo-expose-secrets: true
  security:
    cors:
      allowed-origins: http://localhost:3000,http://127.0.0.1:3000

logging:
  level:
    com.bengalilkc: DEBUG
    org.springframework.boot.docker.compose: INFO
