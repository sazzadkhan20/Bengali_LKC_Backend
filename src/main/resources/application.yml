spring:
  application:
    name: bengali-lkc-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bengali_lkc}
    username: ${DB_USERNAME:lkc_admin}
    password: ${DB_PASSWORD:lkc_secure_change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: BengaliLkcHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50
        # Lazy associations load in batches of 100 ids instead of one query per row (avoids N+1)
        default_batch_fetch_size: 100
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 2048
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Disabled by default; enabled in application-local.yml for IntelliJ / bootRun
  docker:
    compose:
      enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

lkc:
  security:
    jwt:
      # Override in production via JWT_SECRET (min 32 chars)
      secret: ${JWT_SECRET:BengaliLKC-DevOnly-ChangeThisSecretKey-32charsMin!!}
      issuer: bengali-lkc
      cookie-name: lkc_session
      refresh-cookie-name: lkc_refresh
      header-name: Authorization
      token-prefix: "Bearer "
      # Access / session lifetime (minutes). system_config.session_timeout_minutes overrides at runtime.
      access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
      refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  bootstrap:
    seed-demo-users: ${SEED_DEMO_USERS:true}
    import-lexicon-xml: ${IMPORT_LEXICON_XML:false}
    clear-core-lexicon-before-import: ${CLEAR_CORE_LEXICON_BEFORE_IMPORT:false}
    lexicon-xml-path: ${LEXICON_XML_PATH:Documents/Bangla Mono Lingual Lexicons.xml}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Bengali LKC (No Reply)}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    demo-expose-secrets: ${DEMO_EXPOSE_SECRETS:true}

logging:
  level:
    root: INFO
    com.bengalilkc: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
